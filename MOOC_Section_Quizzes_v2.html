</style></head><body><header><strong>Human Geography in Action</strong><p>Department of Geography · The University of Hong Kong</p></header><main><div class="notice">Draft for course review · All 6 modules · 5 questions per section · Supplemented with final transcripts</div><div class="layout"><nav aria-label="Quiz sections"><h2>Choose a section</h2><div class="section-list" id="navigation"></div><p class="small">Practice scores stay in this browser. They are not submitted to a course gradebook.</p><div class="actions"><button id="mode" type="button">Review all questions</button></div></nav><section class="content" id="content" aria-label="Quiz"></section></div></main><script id="quiz-data" type="application/json">[{"id": "1.1", "title": "Understanding human geography", "module": "Human Geography as Empowering Knowledge", "slides": "2–8", "questions": [{"prompt": "Which statement best captures the relationship between people and places in human geography?", "options": ["Places shape physical conditions, while social relationships develop independently of location", "People adapt to places, but their actions leave places fundamentally unchanged", "Places influence people’s opportunities, while people reshape places through their actions", "Places provide a background, while individual characteristics explain all outcomes"], "answer": 2, "explanation": "The relationship works in both directions: places shape people, and people remake places through building, borders, meanings and everyday practices.", "source": "3", "timestamp": "01:41–03:03", "reference": "Slides 3 · Video 01:41–03:03", "transcript_file": "[final] MOOC module-1 (sub).csv"}, {"prompt": "A researcher studies why one street feels welcoming to some people but hostile to others. Which subfield is the closest fit?", "options": ["Environmental geography", "Population geography", "Economic geography", "Cultural geography"], "answer": 3, "explanation": "Cultural geography examines identity and belonging, including how people experience places differently.", "source": "5, 7", "timestamp": "04:49–05:19; 06:59–07:20", "reference": "Slides 5, 7 · Video 04:49–05:19; 06:59–07:20", "transcript_file": "[final] MOOC module-1 (sub).csv"}, {"prompt": "Which topic fits most directly within political geography?", "options": ["The location of specialised suppliers", "How borders become sites of conflict", "Changes in birth rates", "The distribution of heat exposure"], "answer": 1, "explanation": "Political geography focuses on borders and power.", "source": "5, 7", "timestamp": "05:19–05:49; 07:20–07:40", "reference": "Slides 5, 7 · Video 05:19–05:49; 07:20–07:40", "transcript_file": "[final] MOOC module-1 (sub).csv"}, {"prompt": "Which study best combines an environmental concern with a human-geographical question?", "options": ["Identifying the chemical structure of water", "Calculating the orbit of a weather satellite", "Examining why floods affect some communities more severely", "Measuring the temperature at which a mineral melts"], "answer": 2, "explanation": "Human geographers ask how environmental risks affect different places and communities unequally.", "source": "5", "timestamp": "04:21–04:49", "reference": "Slides 5 · Video 04:21–04:49", "transcript_file": "[final] MOOC module-1 (sub).csv"}, {"prompt": "Why are AI’s effects on regional economies still an open research question?", "options": ["AI’s capabilities, adoption and consequences for different kinds of work are still evolving", "AI’s effects are already identical across all occupations and regions", "The geography of work can be explained entirely without studying technology", "Studying a research frontier means predicting one outcome with certainty"], "answer": 0, "explanation": "AI’s capabilities and adoption are still evolving. How they will reshape different kinds of work and the importance of place remains uncertain.", "source": "8", "timestamp": "09:49–10:40", "reference": "Slides 8 · Video 09:49–10:40", "transcript_file": "[final] MOOC module-1 (sub).csv"}]}, {"id": "1.2", "title": "Human geography in practice", "module": "Human Geography as Empowering Knowledge", "slides": "9–15", "questions": [{"prompt": "Which combination best describes the approach of human geographers in practice?", "options": ["Collecting maps without interpreting them", "Spatial thinking, data analysis and understanding particular places", "Financial forecasting without considering location", "National averages and personal intuition alone"], "answer": 1, "explanation": "Human geographers combine spatial thinking, data analysis and place-based understanding to understand and shape how places work.", "source": "10", "timestamp": "13:29–13:50", "reference": "Slides 10 · Video 13:29–13:50", "transcript_file": "[final] MOOC module-1 (sub).csv"}, {"prompt": "A council wants to understand why some neighbourhoods have poor access to jobs. Which contribution best uses human-geographical skills?", "options": ["Mapping access, interpreting local data and communicating with communities", "Applying the same solution everywhere without local evidence", "Replacing local information with a national average", "Comparing only the council’s total population"], "answer": 0, "explanation": "Spatial analysis, data interpretation and communication with communities help explain how places work.", "source": "10, 12", "timestamp": "13:50–16:26", "reference": "Slides 10, 12 · Video 13:50–16:26", "transcript_file": "[final] MOOC module-1 (sub).csv"}, {"prompt": "Why might an employer hire a human geographer for site selection?", "options": ["To identify where opportunities and risks are concentrated", "To guarantee that every site has the same costs", "To avoid considering differences between places", "To make location irrelevant to the decision"], "answer": 0, "explanation": "Organisations make decisions in space and need to understand the geography of opportunity and risk.", "source": "14", "timestamp": "19:02–20:35", "reference": "Slides 14 · Video 19:02–20:35", "transcript_file": "[final] MOOC module-1 (sub).csv"}, {"prompt": "Why do spatial data often require methods that account for geography?", "options": ["Nearby observations always have exactly the same value", "Spatial data contain locations but cannot contain social information", "Mapping a pattern removes the need to analyse relationships in the data", "Nearby observations may be related, so treating them as independent can be misleading"], "answer": 3, "explanation": "Nearby observations tend to resemble each other. Spatial methods account for this geographic structure rather than assuming observations are independent.", "source": "10", "timestamp": "14:28–15:27", "reference": "Slides 10 · Video 14:28–15:27", "transcript_file": "[final] MOOC module-1 (sub).csv"}, {"prompt": "What can conversations with residents add to an analysis based on maps and datasets?", "options": ["A replacement for checking where a pattern occurs", "A guarantee that every resident interprets a place in the same way", "A reason to disregard all quantitative evidence", "Local histories, concerns and meanings that the dataset may miss"], "answer": 3, "explanation": "Residents can explain local histories, concerns and meanings that do not appear in a dataset. Combining their knowledge with spatial analysis gives a fuller understanding of a place.", "source": "10", "timestamp": "15:30–16:26", "reference": "Slides 10 · Video 15:30–16:26", "transcript_file": "[final] MOOC module-1 (sub).csv"}]}, {"id": "2.1", "title": "How regions shape everyday life", "module": "Choosing the Right Place to Live", "slides": "2–9", "questions": [{"prompt": "What defines an economic region?", "options": ["A place where everyone has the same occupation", "An area with exactly one local authority", "Any area with a single postcode", "The space over which an economy operates"], "answer": 3, "explanation": "A region connects commuting, hiring, trade, housing and transport within an operating economy.", "source": "3", "timestamp": "01:56–03:55", "reference": "Slides 3 · Video 01:56–03:55", "transcript_file": "[final] MOOC module-2 (sub).csv"}, {"prompt": "In the “two Marias” thought experiment, why are the two people given identical skills and backgrounds?", "options": ["To focus attention on how different regions shape the opportunities facing the same person", "To show that housing costs are the same for everyone with the same degree", "To demonstrate that individual preferences never affect location decisions", "To establish that the larger region must offer the better life"], "answer": 0, "explanation": "Holding individual characteristics constant highlights the region’s role in shaping jobs, wages, housing and daily life. The smaller region may still be the better fit for Maria’s priorities.", "source": "4", "timestamp": "04:01–06:25", "reference": "Slides 4 · Video 04:01–06:25", "transcript_file": "[final] MOOC module-2 (sub).csv"}, {"prompt": "Why can a higher salary in one region fail to deliver a higher standard of living?", "options": ["Nominal salary already accounts for every local cost", "Higher housing and living costs can offset the salary advantage", "Amenities have identical values everywhere", "All regions offer the same career opportunities"], "answer": 1, "explanation": "Higher wages can come with higher costs, so a bigger paycheque need not buy a better standard of living.", "source": "7–8", "timestamp": "09:44–11:08", "reference": "Slides 7–8 · Video 09:44–11:08", "transcript_file": "[final] MOOC module-2 (sub).csv"}, {"prompt": "What does the contrast between finance in London and manufacturing in Birmingham illustrate?", "options": ["Workers can only work in the sector named for their region", "Regions specialise in different kinds of work", "Every region has the same industrial structure", "The cost of living determines every occupation"], "answer": 1, "explanation": "Regional specialisation affects the types of work available. The examples illustrate tendencies, not exclusive occupations.", "source": "5–6", "timestamp": "06:28–08:30", "reference": "Slides 5–6 · Video 06:28–08:30", "transcript_file": "[final] MOOC module-2 (sub).csv"}, {"prompt": "Why might a regional average give an incomplete picture of your own purchasing power?", "options": ["Personal housing arrangements, space needs and commuting costs can differ from the average", "Personal purchasing power depends on salary but excludes housing and transport", "People with identical salaries necessarily face identical local expenses", "Average living costs already incorporate every household’s circumstances exactly"], "answer": 0, "explanation": "People who share housing or live with family face different costs from those who need more space or have longer commutes. Regional averages are useful starting points, not personalised budgets.", "source": "8", "timestamp": "11:12–11:56", "reference": "Slides 8 · Video 11:12–11:56", "transcript_file": "[final] MOOC module-2 (sub).csv"}]}, {"id": "2.2", "title": "Choosing a region", "module": "Choosing the Right Place to Live", "slides": "10–16", "questions": [{"prompt": "Which three factors should you weigh when choosing a region to live in?", "options": ["Population, land area and rainfall", "Salary, employer size and office height", "Purchasing power, amenities and future earnings potential", "Tourism, manufacturing and government employment"], "answer": 2, "explanation": "The framework balances what income buys, what a place offers and future career prospects.", "source": "11", "timestamp": "14:22–16:05", "reference": "Slides 11 · Video 14:22–16:05", "transcript_file": "[final] MOOC module-2 (sub).csv"}, {"prompt": "Why might the best region for someone at 25 differ from the best region for them at 55?", "options": ["Everyone places the same weight on amenities at every age", "Career prospects cease to matter after 25", "A region’s location changes as residents age", "Their priorities and circumstances can change with life stage"], "answer": 3, "explanation": "Your priorities and circumstances can change with your life stage. Reassessing where you live helps you respond to those changes.", "source": "12, 15", "timestamp": "17:16–20:21", "reference": "Slides 12, 15 · Video 17:16–20:21", "transcript_file": "[final] MOOC module-2 (sub).csv"}, {"prompt": "What is an example of “neighbourhood hedging” within an expensive region?", "options": ["Comparing national salaries without checking housing costs", "Moving abroad solely because a region is expensive", "Choosing a lower-cost neighbourhood while retaining access to the region", "Assuming every neighbourhood offers identical amenities"], "answer": 2, "explanation": "Neighbourhood choice can help balance costs, amenities and access within a region.", "source": "14", "timestamp": "22:16–24:09", "reference": "Slides 14 · Video 22:16–24:09", "transcript_file": "[final] MOOC module-2 (sub).csv"}, {"prompt": "How might AI affect the importance of large metropolitan regions?", "options": ["AI guarantees that all workers will need to move into large metropolitan regions", "AI guarantees that employers will allow everyone to work from any location", "AI will affect location choices equally across all occupations and employers", "AI may loosen some location constraints or strengthen clusters, and the outcome remains uncertain"], "answer": 3, "explanation": "AI may make some work more location-independent, while also increasing the value of clustered talent, firms and capital. Available options depend on skills, industry and employer.", "source": "13", "timestamp": "20:23–22:11", "reference": "Slides 13 · Video 20:23–22:11", "transcript_file": "[final] MOOC module-2 (sub).csv"}, {"prompt": "How can you systematically compare several places you could realistically live?", "options": ["Rank places once and never revisit the result", "Use someone else’s priorities without adjustment", "Weight your priorities and compare evidence on salaries, costs and opportunities", "Choose the region with the highest salary alone"], "answer": 2, "explanation": "The activity combines personal weights with evidence and encourages revisiting the choice over time.", "source": "15–16", "timestamp": "24:13–28:23", "reference": "Slides 15–16 · Video 24:13–28:23", "transcript_file": "[final] MOOC module-2 (sub).csv"}]}, {"id": "3.1", "title": "Location theory and manufacturing", "module": "Choosing the Right Place to Start a Business", "slides": "2–20", "questions": [{"prompt": "In Weber’s locational triangle, where should a factory locate if transport costs are the only consideration?", "options": ["Always at the lowest-wage location", "Where total transport cost between input sources, factory and market is lowest", "At the geometric centre of every triangle, regardless of shipment weights", "Always at the largest market"], "answer": 1, "explanation": "Weber’s triangle seeks the transport-cost-minimising location. Shipment weights affect that location.", "source": "6", "timestamp": "03:15–04:17", "reference": "Slides 6 · Video 03:15–04:17", "transcript_file": "[final] MOOC module-3 (sub).csv"}, {"prompt": "A process uses bulky raw materials and produces a much lighter final product. What location does the weight-losing logic favour?", "options": ["Near the raw material sources", "Where office rents are highest", "Equally far from every supplier and customer", "Near consumers regardless of input locations"], "answer": 0, "explanation": "When production loses weight, transporting the heavy inputs is costly, creating a pull towards their sources.", "source": "7, 12", "timestamp": "04:22–05:29", "reference": "Slides 7, 12 · Video 04:22–05:29", "transcript_file": "[final] MOOC module-3 (sub).csv"}, {"prompt": "Why might a soft-drink bottler locate near its customers?", "options": ["Adding local water increases the weight shipped to customers", "Bottlers receive no benefits from specialised suppliers", "The finished drink weighs less than the imported syrup", "Customer proximity removes the need for workers"], "answer": 0, "explanation": "Adding local water increases the weight of the finished drink. Locating the bottling plant near customers reduces the distance that heavy finished products must travel.", "source": "7", "timestamp": "05:31–06:16", "reference": "Slides 7 · Video 05:31–06:16", "transcript_file": "[final] MOOC module-3 (sub).csv"}, {"prompt": "Which industry is most likely to respond strongly to wage differences, other things equal?", "options": ["Light, labour-intensive production", "A heavy product requiring very little labour", "A business with no employees", "A fully automated bulk-material process"], "answer": 0, "explanation": "The labour pull is strongest for light products whose production requires substantial labour.", "source": "8–9", "timestamp": "06:22–07:49", "reference": "Slides 8–9 · Video 06:22–07:49", "transcript_file": "[final] MOOC module-3 (sub).csv"}, {"prompt": "Which combination of factors helps explain Tesla’s choice of Austin for its factory?", "options": ["The case shows that manufacturers no longer benefit from nearby technical talent", "The case shows that the lowest wage alone determines every factory location", "The case combines transport, labour, clustering benefits and policy incentives", "The case shows that policy incentives make logistics irrelevant"], "answer": 2, "explanation": "The Tesla example extends Weber’s questions to a contemporary decision, considering logistics, labour, the existing technology cluster and policy incentives together.", "source": "15–17", "timestamp": "11:31–14:52", "reference": "Slides 15–17 · Video 11:31–14:52", "transcript_file": "[final] MOOC module-3 (sub).csv"}]}, {"id": "3.2", "title": "The geography of technology startups", "module": "Choosing the Right Place to Start a Business", "slides": "21–41", "questions": [{"prompt": "A founder examines the Atlas of Economic Complexity rather than relying only on a country’s current industrial size. What question can the tool help investigate?", "options": ["What production capabilities has a country developed, and what related capabilities might it build next?", "Which country guarantees the highest profit for every new firm?", "How can existing productive capabilities be excluded from location decisions?", "Which neighbourhood has the shortest commute to every potential customer?"], "answer": 0, "explanation": "The Atlas uses export data to examine production capabilities and their development over time. It helps identify related capabilities a country might build next, without guaranteeing a startup’s success.", "source": "34, 39", "timestamp": "29:15–31:18; 35:36–35:51", "reference": "Slides 34, 39 · Video 29:15–31:18; 35:36–35:51", "transcript_file": "[final] MOOC module-3 (sub).csv"}, {"prompt": "An engineer changes employers without leaving the city, and local firms can recruit from the same workforce. Which mechanism is this?", "options": ["Weight-gaining production", "Congestion pricing", "Labour pooling", "Geocoding"], "answer": 2, "explanation": "Labour pooling gives workers more nearby job options and gives firms access to a deep pool of skills.", "source": "26–28", "timestamp": "24:39–25:29", "reference": "Slides 26–28 · Video 24:39–25:29", "transcript_file": "[final] MOOC module-3 (sub).csv"}, {"prompt": "A startup benefits from nearby prototype shops, specialist lawyers and recruiters. Which cluster advantage is involved?", "options": ["Lower product weight", "A single national wage", "Specialised suppliers", "The absence of competitors"], "answer": 2, "explanation": "Clusters support niche services and suppliers that individual firms can draw upon.", "source": "26, 29–30", "timestamp": "25:32–26:34", "reference": "Slides 26, 29–30 · Video 25:32–26:34", "transcript_file": "[final] MOOC module-3 (sub).csv"}, {"prompt": "An informal conversation with an employee of another firm helps a founder solve a technical problem. What does this illustrate?", "options": ["Knowledge spillovers", "A transport bottleneck", "A change in the coordinate system", "A decline in all local wages"], "answer": 0, "explanation": "Knowledge can spread through informal meetings, social contacts and worker mobility.", "source": "31–32", "timestamp": "26:39–28:09", "reference": "Slides 31–32 · Video 26:39–28:09", "transcript_file": "[final] MOOC module-3 (sub).csv"}, {"prompt": "What should guide a startup’s choice of cluster?", "options": ["Choose a cluster whose strengths fit the startup’s needs", "Choose the largest city regardless of the business", "Assume every technology cluster offers the same advantages", "Avoid places with specialised suppliers"], "answer": 0, "explanation": "A cluster’s specialisation should fit the startup’s needs. The largest cluster is not necessarily the best place for a particular business.", "source": "33, 38–39", "timestamp": "34:40–35:51", "reference": "Slides 33, 38–39 · Video 34:40–35:51", "transcript_file": "[final] MOOC module-3 (sub).csv"}]}, {"id": "4.1", "title": "Traffic congestion and how to solve it", "module": "Getting Around the City", "slides": "2–15", "questions": [{"prompt": "When is traffic congestion most likely to occur?", "options": ["When trips are spread evenly across several uncongested routes", "When travel demand falls below available road capacity", "When travellers use different destinations and departure times", "When many trips converge on the same road links and exceed their capacity"], "answer": 3, "explanation": "Congestion depends on when and where demand concentrates relative to available capacity.", "source": "7–9", "timestamp": "02:57–05:16", "reference": "Slides 7–9 · Video 02:57–05:16", "transcript_file": "[final] MOOC module-4 (sub).csv"}, {"prompt": "How does a bottleneck differ from gridlock?", "options": ["A bottleneck requires more vehicles than gridlock in every case", "A bottleneck affects rail only, while gridlock affects roads only", "Gridlock is another name for any local narrowing", "A bottleneck is a local capacity constraint; gridlock spreads through blocked intersections"], "answer": 3, "explanation": "At a bottleneck, queues grow upstream. In gridlock, blocked movements spread congestion through the network.", "source": "9–10", "timestamp": "05:19–07:29", "reference": "Slides 9–10 · Video 05:19–07:29", "transcript_file": "[final] MOOC module-4 (sub).csv"}, {"prompt": "How does congestion pricing help manage traffic?", "options": ["Adding a new lane whenever a queue appears", "Making every road free during peak periods", "Requiring every traveller to use the same route", "Charging for crowded roads at busy times to manage demand"], "answer": 3, "explanation": "Congestion pricing targets demand on crowded roads and at crowded times.", "source": "11", "timestamp": "07:33–09:17", "reference": "Slides 11 · Video 07:33–09:17", "transcript_file": "[final] MOOC module-4 (sub).csv"}, {"prompt": "Why can congestion pricing and public transit work well together?", "options": ["Pricing creates an incentive to change travel behaviour, while transit provides a practical alternative", "Improving transit makes the timing and concentration of road demand irrelevant", "Pricing and transit both work only by increasing the number of private cars", "Introducing a charge makes the availability of alternative travel options irrelevant"], "answer": 0, "explanation": "Pricing gives travellers an incentive to reconsider when and how they travel, while transit offers an alternative. Pricing without alternatives can feel punitive, and transit improvements alone may not resolve severe peak congestion.", "source": "11–15", "timestamp": "09:55–11:48", "reference": "Slides 11–15 · Video 09:55–11:48", "transcript_file": "[final] MOOC module-4 (sub).csv"}, {"prompt": "Why can public transit help in a busy travel corridor?", "options": ["It removes the need to connect homes and jobs", "It works only when destinations are widely scattered", "It moves more people using less road space per person", "It ensures every passenger travels alone"], "answer": 2, "explanation": "Transit is particularly useful where many journeys share a destination or corridor.", "source": "13–14", "timestamp": "09:55–10:53", "reference": "Slides 13–14 · Video 09:55–10:53", "transcript_file": "[final] MOOC module-4 (sub).csv"}]}, {"id": "4.2", "title": "Public transit planning and network design", "module": "Getting Around the City", "slides": "16–28", "questions": [{"prompt": "Which network layout is particularly suited to radial commuting towards a central location?", "options": ["A hub-and-spoke network", "Separate routes with no interchange", "A grid with no central focus", "Only orbital routes around the edge of the city"], "answer": 0, "explanation": "Hub-and-spoke lines converge at a central hub, supporting radial journeys but often serving crosstown journeys less well.", "source": "19–20", "timestamp": "15:18–15:50", "reference": "Slides 19–20 · Video 15:18–15:50", "transcript_file": "[final] MOOC module-4 (sub).csv"}, {"prompt": "What is a potential advantage of a grid transit network?", "options": ["It eliminates waiting time on every route", "Every journey must pass through one central station", "It serves many origin–destination pairs, although transfers may be needed", "It guarantees that no passenger ever transfers"], "answer": 2, "explanation": "Intersecting lines connect many origins and destinations, often through transfers.", "source": "19", "timestamp": "15:54–16:39", "reference": "Slides 19 · Video 15:54–16:39", "transcript_file": "[final] MOOC module-4 (sub).csv"}, {"prompt": "What does “generalised cost” include when comparing travel options?", "options": ["Only the cost paid by the transport operator", "Only the distance travelled", "Only the ticket price", "Both monetary costs and time costs"], "answer": 3, "explanation": "Travellers weigh money and time, including waiting, access and in-vehicle time where relevant.", "source": "21–22", "timestamp": "17:19–18:09", "reference": "Slides 21–22 · Video 17:19–18:09", "transcript_file": "[final] MOOC module-4 (sub).csv"}, {"prompt": "What defines user equilibrium under Wardrop’s principle?", "options": ["Every road has the same number of vehicles", "No traveller pays a fare or toll", "No traveller can lower their own travel cost by changing route alone", "The transport system achieves the lowest possible total cost for society"], "answer": 2, "explanation": "User equilibrium concerns each traveller’s incentive to switch unilaterally. It does not establish the lowest total social cost.", "source": "23", "timestamp": "19:03–19:42", "reference": "Slides 23 · Video 19:03–19:42", "transcript_file": "[final] MOOC module-4 (sub).csv"}, {"prompt": "If congestion increases driving time while other conditions remain unchanged, what can happen to mode choice?", "options": ["Transit must become slower by the same amount", "Some travellers may find transit relatively more attractive", "Every traveller must keep driving", "Driving’s monetary cost must fall to zero"], "answer": 1, "explanation": "Longer road travel time raises driving’s generalised cost, which can encourage a shift towards transit.", "source": "21, 26", "timestamp": "18:09–18:59; 22:29–24:12", "reference": "Slides 21, 26 · Video 18:09–18:59; 22:29–24:12", "transcript_file": "[final] MOOC module-4 (sub).csv"}]}, {"id": "5.1", "title": "Living with population decline", "module": "Population Change and Everyday Life", "slides": null, "section_basis": "Working section title based on the three-part roadmap in the final transcript.", "questions": [{"prompt": "Which three processes determine population change?", "options": ["Births, deaths and migration", "Life expectancy, public spending and housing prices", "Housing construction, commuting and employment", "Fertility, school enrolment and transport"], nts leave so students can occupy the entire building", "Residents avoid contact with people from other generations"], "answer": 1, "explanation": "In the Humanitas example, students receive accommodation and spend time with older residents. Both groups can benefit from companionship and learning.", "source": null, "timestamp": "13:01–13:31", "reference": "Video 13:01–13:31", "transcript_file": "[final] MOOC module-5 (sub).csv"}, {"prompt": "What contribution can long-term older residents make to neighbourhood life?", "options": ["They remove the need to include younger residents in community activities", "They benefit communities only through demand for health care", "They necessarily oppose all changes to public space", "They can share local knowledge and support activities requiring time and lasting local ties"], "answer": 3, "explanation": "Long-term residents can share local knowledge and support activities such as urban gardening, strengthening relationships across generations.", "source": null, "timestamp": "11:54–12:59", "reference": "Video 11:54–12:59", "transcript_file": "[final] MOOC module-5 (sub).csv"}]}, {"id": "5.3", "title": "Playful and inclusive communities", "module": "Population Change and Everyday Life", "slides": null, "section_basis": "Working section title based on the three-part roadmap in the final transcript.", "questions": [{"prompt": "Why should age-friendly planning go beyond safety and cost control?", "options": ["Only children benefit from enjoyable public spaces", "Safety has no relevance to the design of places", "Efficient services necessarily prevent social participation", "People also value joy, creativity, spontaneity and social connection"], "answer": 3, "explanation": "Safety and cost control matter, but thriving also involves opportunities to participate, create and connect with others.", "source": null, "timestamp": "14:12–14:59", "reference": "Video 14:12–14:59", "transcript_file": "[final] MOOC module-5 (sub).csv"}, {"promp : "Video 16:50–17:02", "transcript_file": "[final] MOOC module-5 (sub).csv"}, {"prompt": "Which approach can help communities thrive as their populations shrink and age?", "options": ["Community design has no influence once a population starts to age", "Thriving depends entirely on restoring population growth before making local improvements", "Thoughtful choices and design can support connected, imaginative communities despite demographic change", "Demographic decline determines that all communities must become poorer and lonelier"], "answer": 2, "explanation": "Demographic change does not make poorer or lonelier communities inevitable. Thoughtful design and community choices can support connection, creativity and participation across ages.", "source": null, "timestamp": "17:06–17:28", "reference": "Video 17:06–17:28", "transcript_file": "[final] MOOC module-5 (sub).csv"}]}, {"id": "6.1", "title": "Maps and spatial data", "module": "Mapping Everyday Life", "slides": "2–6", "questions": [{"prompt": "Which features form the basic building blocks of a map?", "options": ["A list of place names without positions", "Points, lines and polygons positioned using a coordinate system", "Numbers that do not refer to locations", "Photographs arranged without spatial relationships"], "answer": 1, "explanation": "Maps represent features as points, lines and polygons located within a coordinate system.", "source": "3", "timestamp": "02:45–03:32", "reference": "Slides 3 · Video 02:45–03:32", "transcript_file": "[final] MOOC module-6 (sub).csv"}, {"prompt": "What does geocoding do?", "options": ["Deletes place names from a dataset", "Converts addresses or place names into coordinates", "Changes all attributes into colours", "Chooses the font for a map title"], "answer": 1, "explanation": "Geocoding provides the “where” by turning a location description into coordinates.", "source": "5", "timestamp": "04:35–05:18", "reference": "Slides 5 · Video 04:35–05:18", "transcript_file": "[final] MOOC module-6 (sub).csv"}, {"prompt": "A park has coordinates and a recorded name. Which part is attribute data?", "options": ["The coordinate system itself", "The park’s longitude alone", "The park’s name", "The park’s latitude alone"], "answer": 2, "explanation": "Attribute data describes what a feature is or its characteristics, such as its name.", "source": "5", "timestamp": "05:25–06:15", "reference": "Slides 5 · Video 05:25–06:15", "transcript_file": "[final] MOOC module-6 (sub).csv"}, {"prompt": "Which pair of sources can provide spatial data for making a map?", "options": ["Unlabelled images and anonymous text", "Only private survey firms", "Music charts and television schedules", "Government open-data portals and OpenStreetMap"], "answer": 3, "explanation": "Government open-data portals and community projects such as OpenStreetMap provide spatial data that can support mapping.", "source": "6", "timestamp": "06:18–08:19", "reference": "Slides 6 · Video 06:18–08:19", "transcript_file": "[final] MOOC module-6 (sub).csv"}, {"prompt": "A cartographer makes major roads thicker than minor roads. Which visual variable carries the distinction?", "options": ["Texture", "Orientation", "Shape", "Size"], "answer": 3, "explanation": "Line thickness uses size to communicate a difference between features.", "source": "4", "timestamp": "03:38–04:21", "reference": "Slides 4 · Video 03:38–04:21", "transcript_file": "[final] MOOC module-6 (sub).csv"}]}, {"id": "6.2", "title": "Map design and communication", "module": "Mapping Everyday Life", "slides": "7–17", "questions": [{"prompt": "What should guide the initial design of a map?", "options": ["The intended audience and the most important information", "Filling all empty space with decoration", "Including every available variable", "Using the greatest possible number of colours"], "answer": 0, "explanation": "Start with the audience and purpose, then remove elements that do not help communicate the intended information.", "source": "7", "timestamp": "08:23–10:16", "reference": "Slides 7 · Video 08:23–10:16", "transcript_file": "[final] MOOC module-6 (sub).csv"}, {"prompt": "A map must distinguish unordered categories such as parks, schools and hospitals. What is the best design approach?", "options": ["Use distinct category colours and check that the distinctions remain readable for colour-blind viewers", "Choose a numerical gradient and assume that all viewers distinguish it equally well", "Give each category the same hue so readers cannot infer a ranking", "Choose the colours first, then redefine the categories to match them"], "answer": 0, "explanation": "A qualitative scheme distinguishes unordered categories. Checking colour-blind accessibility helps ensure the distinctions are readable for more viewers.", "source": "11", "timestamp": "11:43–12:21; 15:00–16:05", "reference": "Slides 11 · Video 11:43–12:21; 15:00–16:05", "transcript_file": "[final] MOOC module-6 (sub).csv"}, {"prompt": "You want to show values above and below an average. Which scheme fits this purpose?", "options": ["A diverging colour scheme centred on the average", "A qualitative scheme for unrelated categories", "An arbitrary colour for each individual observation", "One identical colour for every value"], "answer": 0, "explanation": "Diverging schemes organise numerical values around a meaningful midpoint such as zero or an average.", "source": "10", "timestamp": "13:46–14:55", "reference": "Slides 10 · Video 13:46–14:55", "transcript_file": "[final] MOOC module-6 (sub).csv"}, {"prompt": "A map shades administrative areas according to their data values. What type of map is this?", "options": ["A map using only pictorial symbols", "A choropleth map", "A map using proportional circles", "A dot-density map"], "answer": 1, "explanation": "A choropleth communicates values by colouring administrative units.", "source": "13", "timestamp": "17:25–18:22", "reference": "Slides 13 · Video 17:25–18:22", "transcript_file": "[final] MOOC module-6 (sub).csv"}, {"prompt": "You have imported spatial data into QGIS and used graduated colours to map the population field. How can you prepare the map for sharing?", "options": ["Create a print layout, add the map and supporting elements, and export the result", "Export immediately without checking how the map and legend communicate the data", "Replace the selected population field with an unrelated variable before export", "Delete the boundary geometry so the map contains only an unlocated table"], "answer": 0, "explanation": "Use a print layout to arrange the map and supporting elements such as the legend, scale bar and north arrow. Check labels, alignment and spacing, then export an image or PDF.", "source": "16–17", "timestamp": "23:33–26:00", "reference": "Slides 16–17 · Video 23:33–26:00", "transcript_file": "[final] MOOC module-6 (sub).csv"}]}]</script><script>
const sections=JSON.parse(document.getElementById('quiz-data').textContent);let current=0,index=0,review=false;let attempts={};try{attempts=JSON.parse(localStorage.getItem('hga-quizzes-v2')||'{}')}catch(e){}const content=document.getElementById('content');
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function state(){let s=sections[current];if(!Array.isArray(attempts[s.id])||attempts[s.id].length!==5)attempts[s.id]=Array(5).fill(null);return attempts[s.id]}
function save(){try{localStorage.setItem('hga-quizzes-v2',JSON.stringify(attempts))}catch(e){}}
function nav(){let module='';document.getElementById('navigation').innerHTML=sections.map((s,i)=>{let h='';if(s.id.split('.')[0]!==module){module=s.id.split('.')[0];h='<div class="module">Module '+module+'</div>'}let a=attempts[s.id],done=Array.isArray(a)&&a.length===5&&a.every(x=>x!==null);return h+'<button type="button" data-section="'+i+'" class="'+(i===current?'active':'')+'" '+(i===current?'aria-current="page"':'')+'>'+s.id+' '+escapeHTML(s.title)+(done?' ✓':'')+'</button>'}).join('');document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{current=Number(b.dataset.section);let a=state();index=a.findIndex(x=>x===null);if(index<0)index=5;render()})}
function heading(s){return '<div class="eyebrow">Module '+s.id.split('.')[0]+' · Section '+s.id+'</div><h1 tabindex="-1">'+escapeHTML(s.title)+'</h1><p class="small">'+escapeHTML(s.module)+'</p>'}
function render(){nav();let s=sections[current],a=state();document.getElementById('mode').textContent=review?'Return to practice':'Review all questions';if(review){content.innerHTML='<div class="eyebrow">Instructor review</div><h1>Question bank</h1><p>65 questions across 13 sections. Each answer includes a video time reference and a slide reference where available. Module 5’s working section titles follow the transcript’s three-part roadmap.</p><div class="actions"><button id="print" type="button">Print / save as PDF</button></div>'+sections.map(t=>'<h2>'+t.id+' · '+escapeHTML(t.title)+'</h2>'+t.questions.map((q,j)=>'<div class="review-question"><h3>'+(j+1)+'. '+escapeHTML(q.prompt)+'</h3><ol type="A">'+q.options.map((o,k)=>'<li class="'+(k===q.answer?'correct':'')+'">'+escapeHTML(o)+(k===q.answer?' ✓ Correct':'')+'</li>').join('')+'</ol><p>'+escapeHTML(q.explanation)+'</p><p class="small">Module '+t.id.split('.')[0]+' · '+escapeHTML(q.reference)+'</p></div>').join('')).join('');document.getElementById('print').onclick=()=>window.print();return}
if(index>=5){let score=s.questions.reduce((n,q,j)=>n+(a[j]===q.answer),0);content.innerHTML=heading(s)+'<div class="feedback"><p>Section complete</p><div class="score">'+score+' / 5</div><p>'+ (score===5?'You answered every question correctly.':'Review the explanations below, then try again whenever you like.')+'</p></div>'+s.questions.map((q,j)=>'<div class="review-question"><strong>'+(j+1)+'. '+escapeHTML(q.prompt)+'</strong><p>Your answer: '+escapeHTML(q.options[a[j]]??'Not answered')+'</p><p class="correct">Correct answer: '+escapeHTML(q.options[q.answer])+'</p><p>'+escapeHTML(q.explanation)+'</p><p class="small">Source: '+escapeHTML(q.reference)+'</p></div>').join('')+'<div class="actions"><button id="retry" type="button">Retry this section</button>'+(current<sections.length-1?'<button id="next-section" type="button" class="primary">Next section</button>':'')+'</div>';document.getElementById('retry').onclick=()=>{attempts[s.id]=Array(5).fill(null);index=0;save();render()};if(document.getElementById('next-section'))document.getElementById('next-section').onclick=()=>{current++;index=state().findIndex(x=>x===null);if(index<0)index=5;render()};return}
let q=s.questions[index],answered=a[index]!==null;content.innerHTML=heading(s)+'<div class="bar"><span style="width:'+(index/5*100)+'%"></span></div><p class="small">Question '+(index+1)+' of 5 · Choose one answer</p><form id="question-form"><fieldset><legend>'+escapeHTML(q.prompt)+'</legend>'+q.options.map((o,j)=>'<label class="option"><input type="radio" name="answer" value="'+j+'" '+(a[index]===j?'checked ':'')+(answered?'disabled':'')+' required><span>'+escapeHTML(o)+'</span></label>').join('')+'</fieldset>'+(answered?'<div class="feedback '+(a[index]===q.answer?'':'wrong')+'" role="status"><strong>'+(a[index]===q.answer?'Correct.':'Correct answer: '+escapeHTML(q.options[q.answer]))+'</strong><p>'+escapeHTML(q.explanation)+'</p><p class="small">Source: Module '+s.id.split('.')[0]+' · '+escapeHTML(q.reference)+'</p></div>':'')+'<div class="actions">'+(index>0?'<button type="button" id="previous">Previous</button>':'')+(answered?'<button class="primary" id="next" type="button">'+(index===4?'See section score':'Next question')+'</button>':'<button class="primary" type="submit">Check answer</button>')+'</div></form><footer>Five questions per section · Untimed · Unlimited retries</footer>';document.getElementById('question-form').onsubmit=e=>{e.preventDefault();const selected=content.querySelector('input[name="answer"]:checked');if(!selected)return;a[index]=Number(selected.value);save();render();content.querySelector('[role="status"]').setAttribute('tabindex','-1');content.querySelector('[role="status"]').focus()};if(document.getElementById('next'))document.getElementById('next').onclick=()=>{index++;render();content.querySelector('h1').focus()};if(document.getElementById('previous'))document.getElementById('previous').onclick=()=>{index--;render()}}
document.getElementById('mode').onclick=()=>{review=!review;render()};render();
</script></body></html>
